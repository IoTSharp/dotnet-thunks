name: build-linux-arm-lowglibc

on:
  push:
    branches:
      - release/10.0
    tags:
      - v*
  pull_request:
    branches:
      - release/10.0
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Optional NuGet package version override
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: build-arm-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  LOWGLIBC_NUGET_PACKAGE_ID: IoTSharp.DotNetRuntime.LowGlibc.Arm32
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  GITHUB_NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build-arm:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang lld llvm build-essential python3 debootstrap qemu-user-static binfmt-support \
            libicu-dev libssl-dev libkrb5-dev zlib1g-dev libcurl4-openssl-dev libunwind-dev libnuma-dev \
            liblttng-ust-dev tar gzip xz-utils unzip symlinks gnupg2 debian-archive-keyring file \
            binutils-arm-linux-gnueabihf

      - name: Build arm buster rootfs
        run: |
          sudo ROOTFS_DIR="$PWD/.tools/rootfs/arm" \
              ./eng/common/cross/build-rootfs.sh arm buster --skipsigcheck
          sudo chown -R "$USER":"$USER" .tools

      - name: Build native runtime (cross arm)
        run: |
          set -euo pipefail
          export ROOTFS_DIR="$PWD/.tools/rootfs/arm"

          # Native-only: build just the native (.so) components, not the managed
          # assemblies (CoreLib, crossgen2, ILCompiler, R2RDump, ...). The bare
          # 'clr'/'libs' subsets pull in all of those managed tools, so prefer the
          # '.native' subsets when they are available.
          if grep -qi 'SubsetName Include="Clr.Native"' eng/Subsets.props \
             && grep -qi 'SubsetName Include="Libs.Native"' eng/Subsets.props \
             && grep -qi 'SubsetName Include="Host.Native"' eng/Subsets.props; then
            SUBSET='clr.native+libs.native+host.native'
          elif grep -qi 'SubsetName Include="Clr.Native"' eng/Subsets.props \
             && grep -qi 'SubsetName Include="Libs.Native"' eng/Subsets.props; then
            SUBSET='clr.native+libs.native'
          else
            SUBSET='clr+libs+host'
          fi

          echo "Using subset: $SUBSET"
          ./build.sh --arch arm --cross --configuration Release --subset "$SUBSET"

      - name: Collect native artifacts
        run: |
          set -euo pipefail
          mkdir -p staging/linux-arm-lowglibc
          find artifacts/bin \( -type f -o -type l \) \( -name '*.so' -o -name '*.so.*' \) \
              -exec cp -av --parents {} staging/linux-arm-lowglibc/ \;

          HOST_DIR="artifacts/bin/linux-arm.Release/corehost"
          test -f "$HOST_DIR/apphost" \
              || { echo "apphost missing from $HOST_DIR"; exit 1; }
          test -f "$HOST_DIR/singlefilehost" \
              || { echo "singlefilehost missing from $HOST_DIR"; exit 1; }
          cp -av --parents "$HOST_DIR/apphost" "$HOST_DIR/singlefilehost" staging/linux-arm-lowglibc/

          test -n "$(find staging/linux-arm-lowglibc -name libcoreclr.so -print -quit)" \
              || { echo 'libcoreclr.so missing'; exit 1; }

      - name: Verify glibc compatibility (<= 2.28)
        run: |
          set -euo pipefail
          OBJDUMP=$(command -v arm-linux-gnueabihf-objdump || command -v llvm-objdump || command -v objdump)
          MAX=$(find staging/linux-arm-lowglibc -type f \( -name '*.so' -o -name '*.so.*' -o -name apphost -o -name singlefilehost \) \
             -exec "$OBJDUMP" -T {} + 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n1 || true)
          test -n "$MAX" || { echo "ERROR: no GLIBC symbol version found in native artifacts"; exit 1; }
          echo "Highest required GLIBC = $MAX"
          LIMIT=GLIBC_2.28
          printf '%s\n%s\n' "$MAX" "$LIMIT" | sort -V | tail -n1 | grep -qx "$LIMIT" \
              || { echo "ERROR: 某些 native artifacts 需要高于 $LIMIT 的 glibc"; exit 1; }

      - name: Prepare NuGet payload
        run: |
          set -euo pipefail
          PAYLOAD="$PWD/artifacts/lowglibc-nuget-payload/linux-arm"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"

          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            case "$base" in
              libcoreclr.so|libclrjit.so|libclrgc.so|libclrgcexp.so|libcoreclrtraceptprovider.so|libmscordaccore.so|libmscordbi.so|libhostpolicy.so|libhostfxr.so|libSystem.*.so)
                if [ -e "$PAYLOAD/$base" ] && ! cmp -s "$file" "$PAYLOAD/$base"; then
                  echo "Replacing duplicate payload file $base with $file"
                fi
                cp -Lv "$file" "$PAYLOAD/$base"
                ;;
            esac
          done < <(find artifacts/bin \( -type f -o -type l \) -name '*.so' -print0)

          HOST_DIR="artifacts/bin/linux-arm.Release/corehost"
          cp -Lv "$HOST_DIR/apphost" "$PAYLOAD/apphost"
          cp -Lv "$HOST_DIR/singlefilehost" "$PAYLOAD/singlefilehost"

          ls -la "$PAYLOAD"
          test -f "$PAYLOAD/libcoreclr.so" || { echo 'libcoreclr.so missing from NuGet payload'; exit 1; }
          test -f "$PAYLOAD/libhostpolicy.so" || { echo 'libhostpolicy.so missing from NuGet payload'; exit 1; }
          test -f "$PAYLOAD/libhostfxr.so" || { echo 'libhostfxr.so missing from NuGet payload'; exit 1; }
          test -f "$PAYLOAD/apphost" || { echo 'apphost missing from NuGet payload'; exit 1; }
          test -f "$PAYLOAD/singlefilehost" || { echo 'singlefilehost missing from NuGet payload'; exit 1; }

      - name: Compute NuGet package version
        id: package_version
        env:
          PACKAGE_VERSION_OVERRIDE: ${{ github.event.inputs.packageVersion }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${PACKAGE_VERSION_OVERRIDE:-}" ]; then
            VERSION="$PACKAGE_VERSION_OVERRIDE"
          else
            MAJOR=$(sed -n 's/.*<MajorVersion>\([^<]*\)<\/MajorVersion>.*/\1/p' eng/Versions.props | head -n1)
            MINOR=$(sed -n 's/.*<MinorVersion>\([^<]*\)<\/MinorVersion>.*/\1/p' eng/Versions.props | head -n1)
            PATCH=$(sed -n 's/.*<PatchVersion>\([^<]*\)<\/PatchVersion>.*/\1/p' eng/Versions.props | head -n1)
            VERSION="${MAJOR}.${MINOR}.${PATCH}-glibc228.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NuGet package version: $VERSION"

      - name: Pack NuGet package
        run: |
          set -euo pipefail
          ./dotnet.sh pack eng/lowglibc-nuget/${LOWGLIBC_NUGET_PACKAGE_ID}.csproj \
            --configuration Release \
            --output "$PWD/artifacts/packages/lowglibc" \
            /p:PackageVersion="${{ steps.package_version.outputs.version }}" \
            /p:LowGlibcPayloadDir="$PWD/artifacts/lowglibc-nuget-payload/linux-arm"

      - name: Pack artifact
        run: |
          set -euo pipefail
          VER=$(date -u +%Y%m%d-%H%M%S)
          tar -C staging -czf dotnet-runtime-linux-arm-glibc228-${VER}.tar.gz linux-arm-lowglibc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-linux-arm-glibc228
          path: dotnet-runtime-linux-arm-glibc228-*.tar.gz
          retention-days: 30

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-linux-arm-glibc228-nuget
          path: artifacts/packages/lowglibc/*.nupkg
          retention-days: 30

      - name: Publish NuGet package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::Missing NuGet API key. Add an organization or repository secret named NUGET_API_KEY."
            exit 1
          fi

          for package in artifacts/packages/lowglibc/*.nupkg; do
            ./dotnet.sh nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate

            ./dotnet.sh nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source "$GITHUB_NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dotnet-runtime-linux-arm-glibc228-*.tar.gz \
              artifacts/packages/lowglibc/*.nupkg \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dotnet-runtime-linux-arm-glibc228-*.tar.gz \
              artifacts/packages/lowglibc/*.nupkg \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "IoTSharp linux-arm lowglibc runtime build for $GITHUB_REF_NAME."
          fi
